[package]
name = "ambient-screensaver"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
chrono = "0.4"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
pollster = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
wgpu = "0.19"
winit = "0.29"
zbus = "5.19"

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.release]
lto = "thin"
